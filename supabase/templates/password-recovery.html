<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your LegacyLink password</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f5f1e6;color:#0f1d3a;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f5f1e6;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background-color:#ffffff;border:1px solid #e3e2db;border-radius:16px;">
            <tr>
              <td style="padding:32px;">
                <img src="https://legacylinks.io/images/email/brand-logo-v1.png" alt="LegacyLink" width="176" style="display:block;max-width:100%;height:auto;border:0;font-size:20px;font-weight:bold;">
                <h1 style="margin:28px 0 12px;font-size:28px;line-height:1.25;">Reset your password</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.6;">Use the link below to choose a new password for your LegacyLink account.</p>
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td bgcolor="#0f1d3a" style="border-radius:10px;">
                      <a href="{{ .SiteURL }}/reset-password#token_hash={{ .TokenHash }}" style="display:inline-block;padding:14px 24px;color:#ffffff;font-size:16px;font-weight:bold;text-decoration:none;">Choose a new password</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-size:14px;line-height:1.6;">If the link expires, return to the login screen and select Forgot password? to request a new one.</p>
                <p style="margin:12px 0 0;font-size:14px;line-height:1.6;">If you didn’t request a password reset, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
