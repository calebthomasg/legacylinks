name: Build Dinglehopper NFC UART check
on:
  pull_request:
    branches: [trailhead/compass-diagnostic-0.1.24]
    paths: [.github/workflows/petopia-artwork-build.yml]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.2.2
      - name: Install the pinned firmware toolchain
        run: |
          set -euo pipefail
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.0.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "Adafruit GPS Library@1.9.0" "Adafruit LIS3MDL@1.2.5"
          git init "$RUNNER_TEMP/lvgl"
          git -C "$RUNNER_TEMP/lvgl" fetch --depth=1 https://github.com/lvgl/lvgl.git 06e229cc7679c01119ca5d905a1f9dad96f475f0
          git -C "$RUNNER_TEMP/lvgl" checkout --detach FETCH_HEAD
          curl --fail --show-error --silent --location --retry 3 https://dl.espressif.com/AE/esp-dev-kits/esp32-3.0.2-h.tar.xz -o "$RUNNER_TEMP/sdk.tar.xz"
          echo "d6c90bb22ff219e4bf56c802f6c0eb7a2880ec7a342054c8d1283f2a53f97b13  $RUNNER_TEMP/sdk.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/trailhead-sdk"
          tar -xJf "$RUNNER_TEMP/sdk.tar.xz" -C "$RUNNER_TEMP/trailhead-sdk"
          target=$(find "$RUNNER_TEMP/trailhead-sdk" -type d -name esp32s3 -print -quit)
          test -n "$target"
          echo "PETOPIA_SDK=$(dirname "$target")" >> "$GITHUB_ENV"
          echo "LVGL_PATH=$RUNNER_TEMP/lvgl" >> "$GITHUB_ENV"
      - name: Test, build, and verify the application image
        run: |
          set -euo pipefail
          cd device/trailhead
          python3 tests/run-network-tests.py
          g++ -std=c++11 -Wall -Wextra -Werror tests/test-petopia-adoption.cpp -o "$RUNNER_TEMP/petopia-adoption-test"
          "$RUNNER_TEMP/petopia-adoption-test"
          sh tools/build.sh
          cp rebuilt/TrailheadFirstBoot.ino.bin "$RUNNER_TEMP/trailhead-0.1.26-app.bin"
          cd "$RUNNER_TEMP"
          test "$(wc -c < trailhead-0.1.26-app.bin)" -le 4194304
          test "$(od -An -tx1 -N1 trailhead-0.1.26-app.bin | tr -d '[:space:]')" = e9
          sha256sum trailhead-0.1.26-app.bin | tee trailhead-0.1.26-app.bin.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dinglehopper-0.1.26-local-upload
          path: |
            ${{ runner.temp }}/trailhead-0.1.26-app.bin
            ${{ runner.temp }}/trailhead-0.1.26-app.bin.sha256
          if-no-files-found: error
