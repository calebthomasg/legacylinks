name: Temporary Memorial Renderer Integration

on:
  push:
    branches:
      - temp/memorial-renderer-integration

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply targeted Trailhead integration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/trailhead/TrailheadMap.tsx')
          text = path.read_text()
          import_anchor = 'import MemorialOwnerDetail from "@/components/trailhead/MemorialOwnerDetail";\n'
          import_line = 'import MemorialDiscoveryDetail from "@/components/trailhead/MemorialDiscoveryDetail";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('MemorialOwnerDetail import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          function_anchor = 'function DiscoveryDetail({ item, onBack }: { item: DiscoveryItem; onBack: () => void }) {\n'
          memorial_return = '  if (item.experience_type === "memorial") return <MemorialDiscoveryDetail experienceId={item.experience_id} fallbackTitle={item.title} fallbackDescription={item.description} onBack={onBack} />;\n'
          if memorial_return not in text:
              if function_anchor not in text:
                  raise SystemExit('DiscoveryDetail function anchor not found')
              text = text.replace(function_anchor, function_anchor + memorial_return, 1)
          path.write_text(text)
          PY
      - name: Commit targeted change
        run: |
          if git diff --quiet; then
            echo "Integration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/trailhead/TrailheadMap.tsx
          git commit -m "Connect structured Memorial renderer surgically"
          git push
