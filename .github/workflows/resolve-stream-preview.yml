name: Resolve Stream preview dependencies
on:
  push:
    branches: [feature/stream-calling]
    paths: ['.github/workflows/resolve-stream-preview.yml']
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --save-exact --ignore-scripts --package-lock-only @stream-io/video-react-sdk@1.46.4 @stream-io/node-sdk@0.8.14
      - name: Output lockfile diff
        run: git diff -- package.json package-lock.json
