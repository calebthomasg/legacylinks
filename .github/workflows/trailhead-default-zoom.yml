name: One-time Trailhead default zoom patch
on:
  push:
    paths:
      - '.github/workflows/trailhead-default-zoom.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set broad default Trailhead zoom
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/trailhead/TrailheadMap.tsx')
          s=p.read_text()
          old='style: "mapbox://styles/mapbox/streets-v12", center, zoom: 12'
          new='style: "mapbox://styles/mapbox/streets-v12", center, zoom: 4'
          if old not in s:
              raise SystemExit('Expected Mapbox initialization string not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/trailhead/TrailheadMap.tsx
          git commit -m "Use broad default Trailhead zoom"
          git push origin main
