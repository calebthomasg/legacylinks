name: Stage Petopia 0.1.21 OTA payload
on:
  pull_request:
    branches: [trailhead/petopia-first-visit]
    paths: [.github/workflows/stage-petopia-ota-0.1.21.yml]
permissions:
  actions: read
  contents: write
jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'trailhead/stage-petopia-ota-0.1.21'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 65f9ddad2293b7ca3150095ec1f2810d7cb9258c
      - uses: actions/download-artifact@v4
        with:
          name: dinglehopper-0.1.21-local-upload
          path: ${{ runner.temp }}/petopia-firmware
          github-token: ${{ github.token }}
          run-id: '44874569418'
      - name: Verify and stage the exact test firmware
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/petopia-firmware/trailhead-0.1.21-app.bin"
          echo "9cc8c9bf0296e43f96788a2dded3d5677a53e27df0d978d3a364e72e74d079dc  $binary" | sha256sum -c -
          node scripts/publish-firmware.mjs test 0.1.21 "$binary" 'Petopia first visit and starter snack. Install the v0.1.21 Petopia artwork pack on microSD.'
          node --test scripts/test-firmware.mjs
          git add -- public/firmware/trailhead/test.json public/firmware/trailhead/releases/0.1.21/trailhead-0.1.21-app.bin
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish Dinglehopper v0.1.21 to the OTA test channel'
          git push origin HEAD:refs/heads/trailhead/ota-petopia-payload-0.1.21
          git rev-parse HEAD
